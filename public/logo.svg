<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Ring Shield -->
  <circle cx="250" cy="250" r="230" fill="url(#emeraldGrad)" filter="url(#dropShadow)" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="8 4" />
  <circle cx="250" cy="250" r="200" fill="url(#shieldGrad)" />

  <!-- Sun Rays in Background -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="3">
    <line x1="250" y1="250" x2="250" y2="60" />
    <line x1="250" y1="250" x2="384" y2="116" />
    <line x1="250" y1="250" x2="440" y2="250" />
    <line x1="250" y1="250" x2="384" y2="384" />
    <line x1="250" y1="250" x2="250" y2="440" />
    <line x1="250" y1="250" x2="116" y2="384" />
    <line x1="250" y1="250" x2="60" y2="250" />
    <line x1="250" y1="250" x2="116" y2="116" />
  </g>

  <!-- Central Open Book Emblem -->
  <g transform="translate(0, -10)">
    <!-- Book Shadow -->
    <path d="M 150,285 Q 250,305 350,285 L 350,205 Q 250,225 150,205 Z" fill="#000000" opacity="0.3" />
    
    <!-- Left Page -->
    <path d="M 140,180 Q 245,200 245,270 L 140,250 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <!-- Right Page -->
    <path d="M 360,180 Q 255,200 255,270 L 360,250 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Spine/Center Glow -->
    <path d="M 245,200 Q 250,195 255,200 L 255,270 Q 250,268 245,270 Z" fill="url(#goldGrad)" />

    <!-- Text lines on left page -->
    <line x1="160" y1="200" x2="230" y2="210" stroke="#047857" stroke-width="3" stroke-linecap="round" />
    <line x1="160" y1="215" x2="225" y2="225" stroke="#047857" stroke-width="3" stroke-linecap="round" />
    <line x1="160" y1="230" x2="220" y2="238" stroke="#047857" stroke-width="3" stroke-linecap="round" />

    <!-- Text lines on right page -->
    <line x1="340" y1="200" x2="270" y2="210" stroke="#047857" stroke-width="3" stroke-linecap="round" />
    <line x1="340" y1="215" x2="275" y2="225" stroke="#047857" stroke-width="3" stroke-linecap="round" />
    <line x1="340" y1="230" x2="280" y2="238" stroke="#047857" stroke-width="3" stroke-linecap="round" />

    <!-- Graduation Cap Floating Above Book -->
    <g transform="translate(250, 140)">
      <!-- Cap Diamond -->
      <polygon points="0,-35 60,-15 0,5 -60,-15" fill="url(#goldGrad)" stroke="#b45309" stroke-width="2" />
      <!-- Cap Base -->
      <path d="M -30,-7 L -30,15 Q 0,25 30,15 L 30,-7 Z" fill="#b45309" />
      <!-- Tassel -->
      <path d="M 50,-18 Q 55,-5 52,15" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round" />
      <circle cx="52" cy="18" r="4" fill="#fef08a" />
    </g>
  </g>

  <!-- Golden Stars -->
  <path d="M 250,75 L 254,87 L 267,87 L 256,95 L 260,107 L 250,99 L 240,107 L 244,95 L 233,87 L 246,87 Z" fill="url(#goldGrad)" />
  <path d="M 120,130 L 123,139 L 133,139 L 125,145 L 128,154 L 120,148 L 112,154 L 115,145 L 107,139 L 117,139 Z" fill="url(#goldGrad)" transform="scale(0.8) translate(30, 30)" />
  <path d="M 380,130 L 383,139 L 393,139 L 385,145 L 388,154 L 380,148 L 372,154 L 375,145 L 367,139 L 377,139 Z" fill="url(#goldGrad)" transform="scale(0.8) translate(110, 30)" />

  <!-- Circular Text Arc Top: NILOFAR CBSE TEST GENERATOR -->
  <path id="textArcTop" d="M 80,250 A 170,170 0 0,1 420,250" fill="none" />
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="21" fill="#ffffff" letter-spacing="2.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      NILOFAR CBSE TEST GENERATOR
    </textPath>
  </text>

  <!-- Circular Text Arc Bottom: 2025-2026 BOARD BLUEPRINT -->
  <path id="textArcBottom" d="M 420,250 A 170,170 0 0,1 80,250" fill="none" />
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="17" fill="url(#goldGrad)" letter-spacing="3">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      2025-2026 BOARD EXAM BLUEPRINT
    </textPath>
  </text>
</svg>
